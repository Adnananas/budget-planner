name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    name: Build and attach release files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build backend
        working-directory: backend
        run: mvn -B package

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Zip frontend
        run: cd frontend/dist && zip -r ../../frontend-dist.zip .

      - name: Upload files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" backend/target/*.jar frontend-dist.zip --clobber