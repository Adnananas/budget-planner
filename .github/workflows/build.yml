name: Build

on:
  push:
    branches: [ main, feature/*, hotfix/*,  release/*] # Passe dies an deine Hauptzweige an
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

# Bricht veraltete Läufe für denselben PR/Branch ab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimale Standardberechtigungen für mehr Sicherheit
permissions:
  contents: read

jobs:
  backend:
    name: Build backend (Java, Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        working-directory: backend
        # -B für Batch-Modus (weniger Log-Rauschen), package baut und testet
        run: mvn -B package

  frontend:
    name: Build frontend (Svelte, TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Empfohlen: Nutze eine .nvmrc-Datei für die Version
          # node-version-file: frontend/.nvmrc
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # 'npm ci' ist für CI-Umgebungen konzipiert und schneller als 'install'
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build